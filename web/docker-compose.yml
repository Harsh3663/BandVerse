services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://bandverse:bandverse@db:5432/bandverse?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change-me-in-production-use-long-random-string
      PAYMENT_PROVIDER: razorpay
      CSRF_PROTECTION: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/v1/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bandverse
      POSTGRES_PASSWORD: bandverse
      POSTGRES_DB: bandverse
    ports:
      - "5432:5432"
    volumes:
      - bandverse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bandverse -d bandverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - bandverse_redis:/data

volumes:
  bandverse_pg:
  bandverse_redis:
